title       = "goodread"
baseURL     = "https://goodread-cli.tamnd.com/"
description = "A command line for public Goodreads data. One binary that reads books, works, authors, series, editions, lists, genres and quotes into structured records, folds them into a local SQLite graph, and writes them out as table, JSON, JSONL, CSV, TSV, RDF or URLs."
contentDir  = "content"
outputDir   = "public"
theme       = "tago-doks"
syntaxHighlight = "true"

[params]
github = "https://github.com/tamnd/goodread-cli"
