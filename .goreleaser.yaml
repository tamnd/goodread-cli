# GoReleaser turns one tag push into everything a user might install from: raw
# archives, Linux packages (deb, rpm, apk), a multi-arch container image, and
# entries for the package managers (Homebrew, Scoop). `git tag vX.Y.Z && git
# push --tags` fans out to all of them through .github/workflows/release.yml.
#
# Publish steps that push to a repository we do not own yet (the Homebrew tap,
# the Scoop bucket) self-disable when their token is absent. A release with no
# extra secrets still produces every downloadable artifact and the container
# image; each manager lights up the moment its repository and token exist.
version: 2

project_name: goodread

before:
  # Only fetch modules; never `go mod tidy` during a release, the tree is kept
  # tidy in CI.
  hooks:
    - go mod download

builds:
  - id: goodread
    binary: goodread
    main: ./cmd/goodread
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tamnd/goodread-cli/cli.Version={{ .Version }}
      - -X github.com/tamnd/goodread-cli/cli.Commit={{ .ShortCommit }}
      - -X github.com/tamnd/goodread-cli/cli.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_7
      - linux_386
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - freebsd_amd64
      - freebsd_arm64

archives:
  # tar.gz everywhere except a zip on Windows.
  - id: default
    name_template: "goodread_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  # One nfpm definition emits the deb, rpm, and apk for every Linux build.
  # goodread is a user command, not a daemon, so there is no unit file and no
  # postinstall: the package is the binary and its license.
  - id: linux-packages
    package_name: goodread
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tamnd
    homepage: https://github.com/tamnd/goodread-cli
    maintainer: Duc-Tam Nguyen <tamnd87@gmail.com>
    description: A command line for public Goodreads data.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/goodread/LICENSE

dockers_v2:
  # One multi-platform image built with buildx. GoReleaser stages the prebuilt
  # binaries under per-platform directories in the build context and the
  # Dockerfile copies the right one through $TARGETPLATFORM.
  - images:
      - ghcr.io/tamnd/goodread
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A command line for public Goodreads data"
      org.opencontainers.image.url: "https://github.com/tamnd/goodread-cli"
      org.opencontainers.image.source: "https://github.com/tamnd/goodread-cli"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "Apache-2.0"

homebrew_casks:
  # Homebrew cask pushed to the tap repository. Self-disables until
  # HOMEBREW_TAP_GITHUB_TOKEN (a PAT with write to tamnd/homebrew-tap) is set,
  # so a tokenless release still writes the cask into dist for inspection.
  - name: goodread
    repository:
      owner: tamnd
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/tamnd/goodread-cli
    description: A command line for public Goodreads data
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    commit_author:
      name: Duc-Tam Nguyen
      email: tamnd87@gmail.com

scoops:
  # Scoop manifest for Windows, pushed to the bucket repository.
  - repository:
      owner: tamnd
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/tamnd/goodread-cli
    description: A command line for public Goodreads data
    license: Apache-2.0
    skip_upload: '{{ if envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    commit_author:
      name: Duc-Tam Nguyen
      email: tamnd87@gmail.com

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # A CycloneDX SBOM per archive via syft; the release workflow installs it.
  - id: archive
    artifacts: archive

signs:
  # Keyless cosign signature over the checksum file. It runs only on a real
  # release in CI, where the workflow grants the OIDC token cosign needs.
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: tamnd
    name: goodread-cli
  draft: false
  prerelease: auto
  name_template: "goodread {{ .Tag }}"
  # Handwritten, and rewritten for each release. GoReleaser puts the generated
  # changelog between this and the footer, so the notes read as a person
  # explaining what changed with the commit list underneath, rather than as a
  # commit list with nothing around it.
  header: |
    A command line for public Goodreads data. One static binary, no API key, no
    account.

    This is the rewrite the tool needed. v0.2.0 read pages and handed back flat
    records. v0.3.0 reads them into a model that knows what it is holding,
    records where every number came from, folds everything into a graph you can
    query, and is honest about the pages it will not read.

    It is a breaking release. The record shape changed, the exit codes changed,
    two flags are gone and one command was renamed. See **Breaking changes**
    below before upgrading.

    ### A book is not a work

    A work is what somebody wrote and a book is one printing of it, and
    conflating them is the most common error in book data. `book` gives you a
    printing, the new `work` command gives you the thing itself, and `editions`
    gives you every printing there is.

    Every `stats` block now names the population it came from, in a `via` field
    that is never omitted. A consumer that averages across records without
    reading it is mixing edition numbers with work numbers and would never find
    out.

    A field the read did not find is absent rather than zero, because a book
    with no page count and a book with zero pages are different facts. And
    contributors carry the role from the edge, so an illustrator comes back as
    an illustrator rather than as an author.

    ### robots.txt, obeyed structurally

    Every readable path is a registered op and nothing builds a URL at the call
    site, so `goodread robots` prints every surface the tool can reach with the
    rule that decides it.

    Four surfaces are disallowed and are no longer read by default: the search
    page, shelves, reviews past the thirty a book page embeds, and `/work/<id>`.
    Two of those have real replacements on allowed surfaces, and those are the
    routes the tool takes: `lookup` goes through `/book/auto_complete` instead
    of site search, and `work` reads the editions page and then the first
    edition's own page instead of the work page.

    `--no-robots` is there for a person who has decided it is their call. It
    warns once, the pace floor still applies, it has no config key and no
    environment variable, and a crawl with it needs `--yes` as well.

    ### A graph, and SQL over it

    Everything read is folded into SQLite as nodes and edges. Nodes are keyed by
    a `gr:` URI built from the legacy id, so `/book/show/2767052` and
    `/book/show/2767052-the-hunger-games` are one row. Edges are a closed set of
    twelve predicates, and a name outside that set is refused at the write.

    `find` searches it, `graph` walks it, `query` runs one read-only statement
    over it, and `export` writes JSONL or Turtle.

    ### A crawler you can stop

    `crawl` reads a seed, stores it, follows the edges the record named, and
    repeats. The frontier lives in the store, so an interrupted crawl continues
    where it stopped and the pages it already read come back out of the cache.
    `--dry-run` prints the plan and reads nothing.

    There is no parallelism flag, and that is the design rather than an
    omission.

    ### An MCP server

    `goodread mcp` serves eleven read tools over stdio. No search, no shelf, no
    reviews, and `--no-robots` has no effect on it even when the process was
    started with the flag.

    The flag's whole justification is a person deciding it is their call, and a
    model calling a tool is not that person deciding. A test fails the build if
    any tool ever reads a disallowed surface.

    ### Breaking changes

    - **The exit codes moved.** v0.2.0 used 3 for no data, 4 for partial and 5
      for blocked. v0.3.0 says what went wrong rather than how the run ended:
      1 unclassified, 2 usage, 3 network, 4 the site answered with an error or a
      block, 5 extraction, 6 not found, 7 refused by robots.txt, 8 robots.txt
      unreadable.
    - **`--workers` is gone.** It was clamped to one, so it did nothing except
      suggest the tool could be told to open ten connections.
    - **`--cookies` is gone.** A challenge is reported and the run exits 4. The
      route around a block is a different surface, not a harder request.
    - **`quote` is now `quotes`**, and takes `--author` for an author's page.
    - **`crawl --parse` is gone.** A crawl parses what it reads.
    - **`search --html` is now `search --deep`**, and needs `--no-robots`.
    - **The record shape changed throughout.** Anything built on v0.2.0 JSON
      needs revisiting. The envelope on every record says which surfaces and
      which ladder rungs produced it, which is the thing to key on going
      forward.

    ### New commands

    `work`, `editions`, `lookup`, `find`, `query`, `graph`, `export`, `mcp`,
    `robots`, `extraction` and `verify`.

    ### Install

    Go:

    ```sh
    go install github.com/tamnd/goodread-cli/cmd/goodread@{{ .Tag }}
    ```

    Homebrew:

    ```sh
    brew install --cask tamnd/tap/goodread
    ```

    Scoop:

    ```sh
    scoop bucket add tamnd https://github.com/tamnd/scoop-bucket
    scoop install goodread
    ```

    Container:

    ```sh
    docker run --rm ghcr.io/tamnd/goodread:{{ trimprefix .Tag "v" }} book 2767052
    ```

    Or download a prebuilt binary for your platform from the assets below.
  footer: |
    ### Verify

    Every archive is listed in `checksums.txt`, which is signed with cosign
    (keyless). Verify the checksum signature before trusting a download:

    ```sh
    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/tamnd/goodread-cli' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
    ```

    The container image and its SBOM are signed the same way.

    ### Links

    - Docs: https://goodread-cli.tamnd.com
    - Source: https://github.com/tamnd/goodread-cli

    Not affiliated with, endorsed by, or sponsored by Goodreads or Amazon.
    goodread reads only public pages and stays within polite rate limits.
